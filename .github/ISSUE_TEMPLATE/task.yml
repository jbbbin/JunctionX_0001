name: "작업 요청"
description: "구현, 리팩터링, 문서화처럼 한 명의 Codex가 독립적으로 맡을 작업"
title: "[Task] "
labels:
  - task
body:
  - type: markdown
    attributes:
      value: |
        이슈 하나에는 가능한 한 하나의 결과물만 담아주세요.
        다른 Codex가 맥락 없이 읽어도 바로 작업할 수 있도록 구체적으로 작성합니다.

  - type: textarea
    id: objective
    attributes:
      label: 목표
      description: 이 작업이 끝났을 때 무엇이 달라져야 하나요?
      placeholder: 사용자가 프로필 사진을 선택하고 변경 사항을 저장할 수 있어야 한다.
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 배경과 맥락
      description: 작업이 필요한 이유와 관련된 결정 사항을 적어주세요.
      placeholder: 현재 상황, 사용자 요구, 관련 논의 등을 적어주세요.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 담당 Codex가 해야 할 일을 체크리스트로 작성해주세요.
      placeholder: |
        - [ ] 화면 구성
        - [ ] 상태 및 오류 처리
        - [ ] 테스트 추가
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: 제외 범위
      description: 충돌과 중복 작업을 막기 위해 이번 이슈에서 다루지 않을 내용을 적어주세요.
      placeholder: 서버 API 변경과 디자인 시스템 수정은 포함하지 않는다.

  - type: textarea
    id: files
    attributes:
      label: 관련 파일 및 영역
      description: 수정이 예상되는 경로나 모듈을 적어주세요. 다른 Codex와 겹치면 먼저 조율합니다.
      placeholder: |
        - Sources/Profile/
        - Tests/ProfileTests/

  - type: textarea
    id: dependencies
    attributes:
      label: 선행 작업 및 의존성
      description: 먼저 완료되어야 하는 이슈, API, 디자인 또는 결정 사항을 적어주세요.
      placeholder: "#12 완료 후 시작. 의존성이 없으면 '없음'."
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 완료 조건
      description: 리뷰어가 완료 여부를 판단할 수 있는 관찰 가능한 조건을 작성해주세요.
      placeholder: |
        - [ ] 정상 입력 시 저장된다.
        - [ ] 실패 시 사용자에게 오류 메시지가 표시된다.
        - [ ] 관련 테스트가 통과한다.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 검증 방법
      description: 실행할 테스트, 명령어 또는 수동 확인 절차를 적어주세요.
      placeholder: |
        1. 앱을 실행한다.
        2. 프로필 화면에서 사진을 변경한다.
        3. 앱 재실행 후 변경 내용이 유지되는지 확인한다.
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: 담당 Codex
      description: 네 명 중 이 작업을 맡을 Codex 식별자를 적어주세요.
      placeholder: Codex A
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: 작업 브랜치
      description: 브랜치 이름을 미리 정해 중복 작업을 방지합니다.
      placeholder: feature/12-profile-image
    validations:
      required: true

  - type: textarea
    id: handoff
    attributes:
      label: 인수인계 메모
      description: 다음 Codex가 알아야 할 제약, 미결정 사항 또는 주의점을 적어주세요.
      placeholder: 작업을 시작할 때는 비워두고, 진행 중 발견한 내용을 갱신해도 됩니다.

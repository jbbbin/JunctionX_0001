name: "버그 신고"
description: "재현 가능한 문제를 기록하고 수정 담당 Codex에게 전달"
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        실제 결과와 기대 결과를 분리하고, 다른 Codex가 같은 문제를 재현할 수 있게 작성해주세요.

  - type: textarea
    id: summary
    attributes:
      label: 문제 요약
      description: 어떤 기능에서 무엇이 잘못되었나요?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      placeholder: |
        1. 앱을 실행한다.
        2. 로그인 버튼을 누른다.
        3. 오류를 확인한다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 기기, OS, 앱 버전, 브랜치 또는 커밋을 적어주세요.
      placeholder: iPhone 17 / iOS 27.0 / developer / abc1234
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 로그 및 화면 자료
      description: 민감정보를 제거한 로그, 스크린샷 또는 영상을 첨부해주세요.

  - type: textarea
    id: suspected_area
    attributes:
      label: 추정 원인 및 관련 파일
      description: 알고 있는 경우에만 작성합니다.

  - type: input
    id: owner
    attributes:
      label: 담당 Codex
      placeholder: Codex B
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 수정 완료 조건
      placeholder: |
        - [ ] 위 재현 절차에서 문제가 발생하지 않는다.
        - [ ] 회귀 테스트가 추가되었다.
        - [ ] 관련 테스트가 통과한다.
    validations:
      required: true
